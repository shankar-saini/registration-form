<body>
    <main class="page">

        <section class="card" aria-labelledby="form-title">
            <h1 id="form-title">Student Registration Form</h1>
            <p class="sub">Fill in the details below. Fields marked <span class="req">*</span> are required. This is a demo, so nothing is sent or stored.</p>

            <form id="reg-form" novalidate>
                <div class="grid">
                <div class="field" data-field="fullname">
                    <label for="fullname">Full name <span class="req">*</span></label>
                    <input type="text" id="fullname" name="fullname" autocomplete="name" placeholder="e.g. Riya Sharma" aria-describedby="fullname-error">
                    <p class="error" id="fullname-error" role="alert"></p>
                </div>
                <div class="field" data-field="email">
                    <label for="email">Email address <span class="req">*</span></label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" aria-describedby="email-error">
                    <p class="error" id="email-error" role="alert"></p>
                </div>
                <div class="field" data-field="phone">
                    <label for="phone">Mobile number <span class="req">*</span></label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel-national" inputmode="numeric" maxlength="10" placeholder="10-digit number" aria-describedby="phone-error">
                    <p class="error" id="phone-error" role="alert"></p>
                </div>
                <div class="field" data-field="dob">
                    <label for="dob">Date of birth <span class="req">*</span></label>
                    <input type="date" id="dob" name="dob" aria-describedby="dob-error">
                    <p class="error" id="dob-error" role="alert"></p>
                </div>
                <div class="field" data-field="course">
                    <label for="course">Course <span class="req">*</span></label>
                    <select id="course" name="course" aria-describedby="course-error">
                        <option value="">Select a course</option>
                        <option>BCA</option>
                        <option>BBA</option>
                        <option>B.Com</option>
                        <option>B.Sc (IT)</option>
                        <option>MCA</option>
                        <option>Diploma in Web Development</option>
                    </select>
                    <p class="error" id="course-error" role="alert"></p>
                </div>
                <div class="field" data-field="percent">
                    <label for="percent">Last exam percentage</label>
                    <input type="number" id="percent" name="percent" min="0" max="100" step="0.1" placeholder="e.g. 78.5" aria-describedby="percent-error">
                    <p class="error" id="percent-error" role="alert"></p>
                </div>

                </div>

                <fieldset class="field" data-field="gender">
                    <legend>Gender <span class="req">*</span></legend>
                    <label class="opt"><input type="radio" name="gender" value="Female"> Female</label>
                    <label class="opt"><input type="radio" name="gender" value="Male"> Male</label>
                    <label class="opt"><input type="radio" name="gender" value="Other"> Other</label>
                    <p class="error" id="gender-error" role="alert"></p>
                </fieldset>

                <div class="field" data-field="address">
                    <label for="address">Address <span class="req">*</span></label>
                    <textarea id="address" name="address" rows="3" maxlength="200" autocomplete="street-address" placeholder="House no., street, city, state" aria-describedby="address-error"></textarea>
                    <p class="error" id="address-error" role="alert"></p>
                </div>

                <div class="field" data-field="terms">
                    <label class="opt"><input type="checkbox" id="terms" name="terms" aria-describedby="terms-error"> I confirm that the details above are correct. <span class="req">*</span></label>
                    <p class="error" id="terms-error" role="alert"></p>
                </div>

                <div class="actions">
                    <button type="submit" class="btn submit">Register</button>
                    <button type="reset" class="btn reset">Reset</button>
                </div>
            </form>

            <div class="summary" id="summary" hidden tabindex="-1" role="status">
                <h2>Registration received (demo)</h2>
                <p>Thank you, <strong id="s-name"></strong>! Here is what you entered:</p>
                <dl id="s-list"></dl>
                <button type="button" class="btn reset" id="again">Register another student</button>
            </div>
        </section>
